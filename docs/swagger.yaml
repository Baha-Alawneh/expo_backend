openapi: 3.0.3
info:
  title: Expo Backend API
  version: 1.0.0
  description: API documentation for the Expo backend endpoints.
servers:
  - url: http://localhost:5000
    description: Local server
paths:
  /register:
    post:
      summary: Register a new user
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: "Jane Doe"
              email: "jane.doe@example.com"
              password: "StrongP@ssw0rd"
              role: "user"
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                message: "User registered successfully."
                userId: "64b7f9d2c2aabf00123abcd4"
        '400':
          description: Bad request (e.g., email already registered)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Email already registered"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Error registering user"
components:
  schemas:
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          description: Full name of the user
          example: Jane Doe
        email:
          type: string
          format: email
          description: User email (must be unique)
          example: jane.doe@example.com
        password:
          type: string
          description: Plain-text password (will be hashed by the server)
          example: StrongP@ssw0rd
        role:
          type: string
          description: Optional role for the user
          example: user
      required:
        - name
        - email
        - password
    RegisterResponse:
      type: object
      properties:
        message:
          type: string
          example: User registered successfully.
        userId:
          type: string
          description: Newly created user's id
          example: 64b7f9d2c2aabf00123abcd4
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: An error message describing the problem
tags:
  - name: Users
    description: Operations related to users
